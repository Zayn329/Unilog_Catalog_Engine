[project]
name = "unilog-catalog-engine"
version = "0.1.0"
description = "SpecForge Unilog Catalog Engine backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pypdfium2>=4.30.0",
    "pint>=0.24.0",
    "pyyaml>=6.0.1",
    "qdrant-client>=1.11.0",
    "python-multipart>=0.0.9",
    "psutil>=6.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-bdd>=7.2.0",
    "faker>=26.0.0",
]

